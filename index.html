const EX=["Rectificatoria interna","Rectificatoria n° Tigre","Rectificatoria","Complementaria interna","Complementaria n° Tigre","Subsidio inc/fall/r. part","Subsidio jubilaciones","Puntos"];
const EMP=[832,57,69,54,52,65,51,92,90,0,350];
let mode="rec",D={rec:BASE.rec,pro:BASE.pro};
for(const k of["rec","pro"])try{const s=JSON.parse(localStorage.getItem("liq_"+k)||"null");if(Array.isArray(s)&&s.length)D[k]=s}catch(e){}
const save=()=>{try{localStorage.setItem("liq_"+mode,JSON.stringify(D[mode]));localStorage.setItem("liq_ts",String(Date.now()))}catch(e){}};
const $=i=>document.getElementById(i),m$=n=>"$ "+Math.round(n).toLocaleString("es-AR"),rows=()=>D[mode];
const MS=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const mk=n=>{const[a,b]=n.split(" ");return MS.indexOf(a)+1+parseInt(b)*12};
const val=r=>{const tot=r.c.reduce((a,b)=>a+b,0);if(mode=="pro")return{tot,cien:r.k};const dist=tot+r.r[0]+r.r[1]+r.r[2]-r.s[0]-r.s[1]-r.s[2]-r.s[3];return{tot,dist,cien:r.p?dist/r.p*BASE.f*100:0}};
function draw(){const R=rows(),r=R[+$("sel").value];if(!r)return;const v=val(r);$("mes").textContent=r.m.toLowerCase();
$("sub").textContent=mode=="rec"?"LIQUIDACIÓN CAJA DE EMPLEADOS":"PRODUCTIVIDAD";
$("filas").innerHTML=`<div class="r pe-h"><span>CASINO</span><span>MONTO</span><span class="pe">POR EMPLEADO</span></div>`+CAS.map((c,k)=>`<div class="r"><span>${c}</span><span>${r.c[k]?m$(r.c[k]):""}</span><span class="pe">${EMP[k]&&r.c[k]?m$(r.c[k]/EMP[k]):"—"}</span></div>`).join("")+`<div class="r t"><span>100 PUNTOS I.O.MA.</span><span>${m$(v.cien)}</span><span class="pe"></span></div>`;
let t=mode=="rec"?`Total a distribuir: ${m$(v.dist)} · Puntos: ${r.p.toLocaleString("es-AR")}`:`Total productividad: ${m$(v.tot)}`;
const p=R.find(x=>mk(x.m)===mk(r.m)-12);if(p)t+=`<br>Vs. ${p.m.toLowerCase()}: ${((v.cien/val(p).cien-1)*100).toFixed(1)}%`;$("nota").innerHTML=t}
function fill(i){const R=rows();R.sort((a,b)=>mk(a.m)-mk(b.m));$("sel").innerHTML=R.map((r,i)=>`<option value="${i}">${r.m}</option>`).join("");$("sel").value=i??R.length-1;draw()}
function sw(m){const cur=$("sel").selectedOptions[0]?$("sel").selectedOptions[0].textContent:"";mode=m;$("tr").className=m=="rec"?"on":"";$("tp").className=m=="pro"?"on":"";const R=rows();R.sort((a,b)=>mk(a.m)-mk(b.m));const i=R.findIndex(x=>x.m===cur);fill(i>=0?i:undefined)}
const fmt=n=>n?n.toLocaleString("es-AR",{maximumFractionDigits:2}):"",num=s=>parseFloat(String(s).replace(/\./g,"").replace(",","."))||0;
function inp(l,k,v){return`<label>${l}</label><input data-k="${k}" inputmode="decimal" autocomplete="off" value="${fmt(v)}">`}
function flat(r){return mode=="rec"?[...r.c,...r.r,...r.s,r.p]:[...r.c,r.k]}
function tab(n){$("p1").className=n==1?"on":"";$("p2").className=n==2?"on":"";$("g1").parentNode.hidden=n!=1;$("s2").hidden=n!=2}
function nextMes(){const R=rows();if(!R.length)return"ENERO 2025";
const last=R.slice().sort((a,b)=>mk(a.m)-mk(b.m)).pop().m;const[n,y]=last.split(" ");const i=MS.indexOf(n);
return i===11?("ENERO "+(+y+1)):(MS[i+1]+" "+y)}
function open_(){const mes=nextMes(),a=mode=="rec"?Array(19).fill(0):Array(12).fill(0);
$("f_m").value=mes;
$("g1").innerHTML=CAS.map((c,k)=>inp(c,k,a[k])).join("")+(mode=="pro"?inp("100 PUNTOS I.O.MA.",11,a[11]):"");
$("g2").innerHTML=mode=="rec"?EX.map((c,k)=>inp(c,11+k,a[11+k])).join(""):"";$("p2").hidden=mode!="rec";tab(1);calc();$("dlg").showModal()}
function read(){const a=[];document.querySelectorAll("#dlg [data-k]").forEach(e=>a[+e.dataset.k]=num(e.value));const m=$("f_m").value.trim().toUpperCase();
return mode=="rec"?{m,c:a.slice(0,11),r:a.slice(11,14),s:a.slice(14,18),p:a[18]||0}:{m,c:a.slice(0,11),k:a[11]||0}}
function calc(){const r=read(),v=val(r);$("calc").innerHTML=`Total ${m$(v.tot)} · 100 puntos ${m$(v.cien)}`}
const dl=$("dlg");dl.addEventListener("focusin",e=>{if(e.target.dataset.k!==undefined){e.target.value=e.target.value.replace(/\./g,"");setTimeout(()=>e.target.select(),0)}});
dl.addEventListener("focusout",e=>{if(e.target.dataset.k!==undefined){e.target.value=fmt(num(e.target.value));calc()}});
dl.addEventListener("input",calc);dl.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset.k!==undefined){e.preventDefault();const f=[...dl.querySelectorAll("[data-k]")].filter(x=>x.offsetParent),i=f.indexOf(e.target);(f[i+1]||$("ok")).focus()}});
$("sel").onchange=draw;$("nuevo").onclick=open_;$("x").onclick=()=>dl.close();$("p1").onclick=()=>tab(1);$("p2").onclick=()=>tab(2);$("tr").onclick=()=>sw("rec");$("tp").onclick=()=>sw("pro");
$("ok").onclick=()=>{const r=read();if(!r.m)return alert("El campo MES es obligatorio.");if(!/^[A-ZÁÉÍÓÚ]+ \d{4}$/.test(r.m)||MS.indexOf(r.m.split(" ")[0])<0)return alert("Escribí el mes así: OCTUBRE 2026");
const R=rows(),i=R.findIndex(x=>x.m===r.m);i>=0?R[i]=r:R.push(r);save();fill(rows().findIndex(x=>x.m===r.m));dl.close()};
$("bu").onclick=()=>{const R=rows();if(R.length&&confirm("¿Borrar el último mes ("+R[R.length-1].m+")?")){R.pop();save();fill();dl.close()}};
$("bt").onclick=()=>{if(confirm("¿Borrar TODOS los meses de esta tabla?")&&confirm("Esto no se puede deshacer. ¿Seguro?")){D[mode]=[];save();fill();dl.close()}};

/* —— Columna por empleado (oculta hasta tocar el botón) —— */
$("btnPe").onclick=()=>{const on=document.body.classList.toggle("pe-on");$("btnPe").classList.toggle("on",on)};

/* —— Gráficos (diálogo integrado) —— */
let chartInst = null, chartMode = 'rec';
const shortM = m => m.replace('ENERO','Ene').replace('FEBRERO','Feb').replace('MARZO','Mar')
  .replace('ABRIL','Abr').replace('MAYO','May').replace('JUNIO','Jun').replace('JULIO','Jul')
  .replace('AGOSTO','Ago').replace('SEPTIEMBRE','Sep').replace('OCTUBRE','Oct')
  .replace('NOVIEMBRE','Nov').replace('DICIEMBRE','Dic');

function pack(list){
  const R = (list||[]).slice().sort((a,b)=>mk(a.m)-mk(b.m));
  return {
    labels: R.map(r=>shortM(r.m)),
    central: R.map(r=>r.c[0]/1e6),
    tigre: R.map(r=>r.c[10]/1e6),
    resto: R.map(r=>r.c.slice(1,10).reduce((s,v)=>s+v,0)/1e6),
    months: R.map(r=>r.m)
  };
}
function fmtM(v){ return '$ '+Number(v).toLocaleString('es-AR',{maximumFractionDigits:1})+' M'; }

function renderChart(){
  if(typeof Chart === 'undefined'){
    $('chMeta').innerHTML = '<span style="color:#c00">No se pudo cargar Chart.js (hace falta internet la primera vez).</span>';
    return;
  }
  const S = pack(D[chartMode]);
  $('chTitle').textContent = chartMode==='rec' ? 'Evolución · Caja de Empleados' : 'Evolución · Productividad';
  $('chRec').className = chartMode==='rec' ? 'on' : '';
  $('chPro').className = chartMode==='pro' ? 'on' : '';
  if(S.labels.length){
    const i = S.labels.length-1;
    $('chMeta').innerHTML =
      '<span><b>Último:</b> '+S.months[i]+'</span>'+
      '<span>Central '+fmtM(S.central[i])+'</span>'+
      '<span>Tigre '+fmtM(S.tigre[i])+'</span>'+
      '<span>Resto '+fmtM(S.resto[i])+'</span>';
  } else {
    $('chMeta').innerHTML = '<span>Sin datos para graficar</span>';
  }

  /* Siempre colores claros, aunque el dispositivo esté en modo oscuro */
  const grid = 'rgba(0,0,0,.07)';
  const tick = '#555';
  const text = '#111';
  const ds = (label, data, color) => ({
    label, data, borderColor: color, backgroundColor: color,
    borderWidth: 2.5, pointRadius: 3.5, pointHoverRadius: 6,
    pointBackgroundColor: color, tension: 0.28, fill: false
  });
  if(chartInst){ try{ chartInst.destroy(); }catch(e){} chartInst = null; }
  chartInst = new Chart($('chCanvas'), {
    type: 'line',
    data: {
      labels: S.labels,
      datasets: [
        ds('Casino Central', S.central, '#c0501a'),
        ds('Tigre', S.tigre, '#2e7d32'),
        ds('Resto (suma otros)', S.resto, '#1565c0')
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: text, boxWidth: 12, padding: 14, font: { size: 12, weight: '600' } } },
        tooltip: {
          backgroundColor: '#fff',
          titleColor: text, bodyColor: text,
          borderColor: '#ccc', borderWidth: 1, padding: 10,
          callbacks: { label: ctx => ' '+ctx.dataset.label+': '+fmtM(ctx.parsed.y) }
        }
      },
      scales: {
        x: { ticks: { color: tick, maxRotation: 40, minRotation: 40, font: { size: 10 } }, grid: { color: grid, drawBorder: false } },
        y: {
          title: { display: true, text: 'Millones de $', color: tick, font: { size: 11 } },
          ticks: { color: tick, callback: v => v.toLocaleString('es-AR') },
          grid: { color: grid, drawBorder: false }, beginAtZero: false
        }
      }
    }
  });
}

function closeChartDlg(){
  const dlg = $('dlgChart');
  if(dlg && dlg.open) dlg.close();
  if(chartInst){ try{ chartInst.destroy(); }catch(e){} chartInst = null; }
}

function openChartDlg(){
  chartMode = mode;
  const dlg = $('dlgChart');
  if(!dlg) return;
  dlg.showModal();
  requestAnimationFrame(function(){
    renderChart();
    setTimeout(function(){ if(chartInst) chartInst.resize(); }, 60);
  });
}

$('btnGraf').onclick = openChartDlg;
$('chX').onclick = closeChartDlg;
$('chRec').onclick = function(){ chartMode = 'rec'; renderChart(); };
$('chPro').onclick = function(){ chartMode = 'pro'; renderChart(); };
$('dlgChart').addEventListener('cancel', function(){ if(chartInst){ try{ chartInst.destroy(); }catch(e){} chartInst = null; } });
$('dlgChart').addEventListener('click', function(e){ if(e.target === $('dlgChart')) closeChartDlg(); });

/* —— Comparar año contra año —— */
let cmMode='rec', cmIdx=0, cmKeys=false;
const cmRows=()=>D[cmMode].slice().sort((a,b)=>mk(a.m)-mk(b.m));
const cien=(r,m)=>{const o=mode;mode=m;try{return val(r).cien}finally{mode=o}};
function cmPair(){const R=cmRows(),a=R[cmIdx];if(!a)return{a:null,b:null};return{a,b:R.find(x=>mk(x.m)===mk(a.m)-12)||null}}
function cmFill(name){const R=cmRows();let k=R.findIndex(r=>r.m===name);cmIdx=k>=0?k:Math.max(0,R.length-1);cmDraw()}
function pct(a,b){if(!b)return'<span>—</span>';const d=a/b-1,s=(Math.abs(d)*100).toFixed(1).replace('.',',')+'%';return d>=0?'<span class="up">▲ '+s+'</span>':'<span class="dn">▼ '+s+'</span>'}
function cmDraw(){const R=cmRows(),pair=cmPair(),a=pair.a,b=pair.b;$('cmRec').className=cmMode==='rec'?'on':'';$('cmPro').className=cmMode==='pro'?'on':'';
 if(!a){$('cmT').innerHTML='';$('cmHint').textContent='Sin datos';$('cmN').textContent='';return}
 $('cmHint').textContent=a.m+' · '+(b?b.m:'sin año anterior');
 let h='<div class="h">CASINO</div><div class="h">'+(b?b.m:'Año anterior')+'</div><div class="h">'+a.m+'</div><div class="h">Variación</div>';
 CAS.forEach((c,k)=>{const x=b?b.c[k]:0,y=a.c[k];h+='<div>'+c+'</div><div>'+(x?m$(x):'—')+'</div><div>'+(y?m$(y):'')+'</div><div>'+((x&&y)?pct(y,x):'—')+'</div>'});
 const x=b?cien(b,cmMode):0,y=cien(a,cmMode);h+='<div class="tt">100 PUNTOS I.O.MA.</div><div class="tt">'+(b?m$(x):'—')+'</div><div class="tt">'+m$(y)+'</div><div class="tt">'+(b?pct(y,x):'—')+'</div>';
 $('cmT').innerHTML=h;$('cmN').textContent='Comparación fija con el mismo mes del año anterior. ◀ ▶ cambian de mes'+(cmKeys?' · flechas del teclado activas':'')+'.'}
function armKeys(){cmKeys=true;$('cmPrev').classList.add('on');$('cmNext').classList.add('on');cmDraw()}
$('btnCmp').onclick=()=>{cmKeys=false;$('cmPrev').classList.remove('on');$('cmNext').classList.remove('on');cmMode=mode;cmFill($('sel').selectedOptions[0]?$('sel').selectedOptions[0].textContent:'');$('dlgCmp').showModal()};
$('cmX').onclick=()=>$('dlgCmp').close();$('cmRec').onclick=()=>{cmMode='rec';cmFill(cmRows()[cmIdx]?cmRows()[cmIdx].m:'')};$('cmPro').onclick=()=>{const name=cmRows()[cmIdx]?cmRows()[cmIdx].m:'';cmMode='pro';cmFill(name)};
function cmShift(d){const R=cmRows();let i=cmIdx+d;if(i<0||i>=R.length)return;cmIdx=i;cmDraw()}
$('cmPrev').onclick=()=>{armKeys();cmShift(-1)};
$('cmNext').onclick=()=>{armKeys();cmShift(1)};
$('dlgCmp').addEventListener('click',e=>{if(e.target===$('dlgCmp'))$('dlgCmp').close()});
$('dlgCmp').addEventListener('close',()=>{cmKeys=false;$('cmPrev').classList.remove('on');$('cmNext').classList.remove('on')});
$('dlgCmp').addEventListener('keydown',e=>{
  if(!cmKeys) return;
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight' && e.key!=='ArrowUp' && e.key!=='ArrowDown') return;
  e.preventDefault();
  cmShift((e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:1);
});

fill();

/* —— Exportar / importar JSON y sincronizar con datos.json de GitHub —— */
const getTs=()=>{try{return +localStorage.getItem("liq_ts")||0}catch(e){return 0}};
const fecha=t=>t?new Date(t).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):"sin fecha";
const valida=o=>{const ok=a=>Array.isArray(a)&&a.length&&a.every(r=>r&&typeof r.m=="string"&&Array.isArray(r.c));return !!o&&ok(o.rec)&&ok(o.pro)};
function aplicar(o,ts){D.rec=o.rec;D.pro=o.pro;
  try{localStorage.setItem("liq_rec",JSON.stringify(D.rec));localStorage.setItem("liq_pro",JSON.stringify(D.pro));localStorage.setItem("liq_ts",String(ts))}catch(e){}
  fill()}
function exportar(){const ts=getTs()||Date.now();
  const o={app:"liquidacion-caja",version:1,ts,actualizado:new Date(ts).toISOString(),rec:D.rec,pro:D.pro};
  const b=new Blob([JSON.stringify(o,null,1)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="datos.json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  $("dsta").textContent="Exportado datos.json (datos del "+fecha(ts)+"). Subilo a GitHub reemplazando el anterior."}
$("bExp").onclick=exportar;
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const o=JSON.parse(t);if(!valida(o))throw 0;
    if(confirm("¿Reemplazar los datos actuales con los de "+f.name+"?\n("+o.rec.length+" meses de Caja · "+o.pro.length+" de Productividad)")){aplicar(o,Date.now());$("dsta").textContent="Importado "+f.name+"."}})
  .catch(()=>alert("El archivo no es un JSON válido de esta planilla."))
  .finally(()=>{e.target.value=""})};
/* Al abrir: si en GitHub hay un datos.json más nuevo que lo guardado acá, se usa ese */
fetch("datos.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(o=>{
  if(!valida(o))return;const ft=+o.ts||0;
  if(ft>getTs()){aplicar(o,ft);$("dsta").textContent="Datos actualizados desde GitHub ("+fecha(ft)+")."}
}).catch(()=>{});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
