<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Liquidación Caja de Empleados</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c0501a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caja">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f2f2;--card:#fff;--tx:#111;--mu:#666;--bd:#222;--ac:#f6b98a;--ac2:#c0501a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#222;--tx:#f1f1f1;--mu:#aaa;--bd:#888;--ac:#5a3a24;--ac2:#ff9a5c}}
:root[data-theme="dark"]{--bg:#161616;--card:#222;--tx:#f1f1f1;--mu:#aaa;--bd:#888;--ac:#5a3a24;--ac2:#ff9a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
.nav{display:flex;margin-bottom:12px}.nav button{flex:1;padding:10px;font-weight:700;border-radius:0}.nav button.on{background:var(--ac);color:var(--tx)}
.card{background:var(--card);border:2px solid var(--bd);padding:18px;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
.hd{display:flex;gap:14px;align-items:center}.hd img{width:92px;height:92px;object-fit:contain;background:#fff;border-radius:50%}
.hd small{display:block;font-size:11px;font-weight:700;letter-spacing:.3px}.hd h1{margin:4px 0 0;font-size:26px;text-transform:lowercase}
select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);padding:8px;border-radius:4px;cursor:pointer}
.sel{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}.sel select{flex:1;min-width:140px}.sel button{flex:0 0 auto}
.r{display:flex;border:1px solid var(--bd);margin:8px 0;font-style:italic;font-weight:700;font-size:14px}
.r span{padding:9px 10px}.r span:first-child{flex:1;border-right:1px solid var(--bd)}.r span:last-child{width:46%;text-align:right}
.t{background:var(--ac);font-size:16px}.t span:last-child{color:var(--ac2)}
.n{font-size:12px;color:var(--mu);margin-top:12px;line-height:1.6}
dialog{width:94%;max-width:430px;padding:0;border:2px solid #333;background:#c0c0c0;color:#000;font-family:Tahoma,Verdana,sans-serif}
.tb{background:#fff;padding:5px 8px;font-size:12px;display:flex;justify-content:space-between}.tb b{cursor:pointer;font-weight:400}
.body{padding:16px}.mes{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:700;font-size:22px;margin-bottom:12px}
.mes input{width:200px;font-size:15px}
.tabs button{background:#e8e8e8;color:#000;border:1px solid #888;border-bottom:0;border-radius:3px 3px 0 0;font-size:13px;padding:5px 8px}.tabs button.on{background:#f4f4f4;font-weight:700}
.pg{background:#f4f4f4;border:1px solid #888;padding:12px}
fieldset{border:0;background:#a8f3e6;margin:0;padding:0 8px 10px}legend{display:none}
.lg{font-size:20px;font-weight:700;margin:0 0 8px;padding:2px 4px;background:#a8f3e6}
.f{display:grid;grid-template-columns:1fr 130px;gap:5px 8px;align-items:center}.f label{text-align:right;font-weight:700;font-size:13px;text-transform:uppercase}
.f input,.mes input{border:2px inset #999;background:#fff;color:#000;padding:4px 6px;font:inherit;font-size:13px;border-radius:0;caret-color:transparent;text-align:right;outline:0;-webkit-appearance:none;appearance:none}
.mes input{text-align:left}.f input:focus,.mes input:focus{background:#fffbd0;border-color:#0b3d3d}
.bt{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}.bt button{background:#0b3d3d;color:#fff;font-weight:700;border:2px outset #7aa;border-radius:0;padding:10px 12px;font-size:13px}
.cl{font-size:12px;text-align:center;margin-top:8px}

#btnGraf{background:var(--ac);font-weight:700;border:1px solid var(--bd);white-space:nowrap}
#btnGraf:hover{filter:brightness(1.06)}
#btnCmp{background:var(--ac);font-weight:700;border:1px solid var(--bd);white-space:nowrap}
#dlgCmp{width:min(96vw,780px);max-width:96vw;max-height:90vh;padding:0;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif}
#dlgCmp::backdrop{background:rgba(0,0,0,.5)}
.cm-bd{padding:12px 14px}.cm-sel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}.cm-sel label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px;flex:1;min-width:140px}.cm-nav{display:flex;gap:6px;align-items:center;padding-bottom:1px}.cm-nav button{padding:8px 12px;font-weight:700;border:1px solid var(--bd);background:var(--card);cursor:pointer;min-width:42px}.cm-nav button:hover{background:var(--ac)}.cm-nav .cm-hint{font-size:11px;color:var(--mu);line-height:1.25;max-width:120px}
.cm-t{display:grid;grid-template-columns:1.3fr 1fr 1fr .7fr;border:1px solid var(--bd);background:var(--card);font-size:13px}.cm-t>div{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right}.cm-t>div:nth-child(4n+1){text-align:left;font-weight:700}.cm-t .h{background:var(--ac);font-weight:700}.cm-t .tt{background:var(--ac);font-weight:700}
.cm-nav button.on{outline:2px solid var(--ac2);outline-offset:1px}
.up{color:#16803c}.dn{color:#c62828}@media(prefers-color-scheme:dark){.up{color:#5fd68a}.dn{color:#ff7b7b}}
#dlgChart{width:min(96vw,1100px);max-width:96vw;height:min(88vh,700px);max-height:88vh;padding:0;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif}
#dlgChart::backdrop{background:rgba(0,0,0,.5)}
.ch-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--bd);background:var(--card);flex-wrap:wrap}
.ch-hd h2{margin:0;font-size:16px;font-weight:700;flex:1;min-width:120px}
.ch-tabs{display:flex}
.ch-tabs button{padding:8px 14px;font-weight:700;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;border-radius:0}
.ch-tabs button.on{background:var(--ac)}
.ch-x{font-size:18px;cursor:pointer;padding:6px 12px;border:1px solid var(--bd);background:var(--card);line-height:1;font-weight:700}
.ch-x:hover{background:var(--ac)}
.ch-body{display:flex;flex-direction:column;height:calc(100% - 56px);padding:12px 14px 10px;box-sizing:border-box}
.ch-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:12px;color:var(--mu)}
.ch-meta span{background:var(--card);border:1px solid var(--bd);padding:3px 8px}
.ch-box{flex:1;min-height:200px;position:relative;background:var(--card);border:2px solid var(--bd);padding:8px 10px}
.ch-note{font-size:11px;color:var(--mu);margin-top:8px;line-height:1.4}
</style><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

/* —— Gráficos (diálogo integrado) —— */
let chartInst = null, chartMode = 'rec';
const shortM = m => m.replace('ENERO','Ene').replace('FEBRERO','Feb').replace('MARZO','Mar')
  .replace('ABRIL','Abr').replace('MAYO','May').replace('JUNIO','Jun').replace('JULIO','Jul')
  .replace('AGOSTO','Ago').replace('SEPTIEMBRE','Sep').replace('OCTUBRE','Oct')
  .replace('NOVIEMBRE','Nov').replace('DICIEMBRE','Dic');

function pack(list){
  const R = (list||[]).slice().sort((a,b)=>mk(a.m)-mk(b.m));
  return {
    labels: R.map(r=>shortM(r.m)),
    central: R.map(r=>r.c[0]/1e6),
    tigre: R.map(r=>r.c[10]/1e6),
    resto: R.map(r=>r.c.slice(1,10).reduce((s,v)=>s+v,0)/1e6),
    months: R.map(r=>r.m)
  };
}
function fmtM(v){ return '$ '+Number(v).toLocaleString('es-AR',{maximumFractionDigits:1})+' M'; }

function renderChart(){
  if(typeof Chart === 'undefined'){
    $('chMeta').innerHTML = '<span style="color:#c00">No se pudo cargar Chart.js (hace falta internet la primera vez).</span>';
    return;
  }
  const S = pack(D[chartMode]);
  $('chTitle').textContent = chartMode==='rec' ? 'Evolución · Caja de Empleados' : 'Evolución · Productividad';
  $('chRec').className = chartMode==='rec' ? 'on' : '';
  $('chPro').className = chartMode==='pro' ? 'on' : '';
  if(S.labels.length){
    const i = S.labels.length-1;
    $('chMeta').innerHTML =
      '<span><b>Último:</b> '+S.months[i]+'</span>'+
      '<span>Central '+fmtM(S.central[i])+'</span>'+
      '<span>Tigre '+fmtM(S.tigre[i])+'</span>'+
      '<span>Resto '+fmtM(S.resto[i])+'</span>';
  } else {
    $('chMeta').innerHTML = '<span>Sin datos para graficar</span>';
  }

  const isDark = matchMedia('(prefers-color-scheme:dark)').matches || document.documentElement.dataset.theme==='dark';
  const grid = isDark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.07)';
  const tick = isDark ? '#aaa' : '#555';
  const text = isDark ? '#f1f1f1' : '#111';
  const ds = (label, data, color) => ({
    label, data, borderColor: color, backgroundColor: color,
    borderWidth: 2.5, pointRadius: 3.5, pointHoverRadius: 6,
    pointBackgroundColor: color, tension: 0.28, fill: false
  });
  if(chartInst){ try{ chartInst.destroy(); }catch(e){} chartInst = null; }
  chartInst = new Chart($('chCanvas'), {
    type: 'line',
    data: {
      labels: S.labels,
      datasets: [
        ds('Casino Central', S.central, '#c0501a'),
        ds('Tigre', S.tigre, '#2e7d32'),
        ds('Resto (suma otros)', S.resto, '#1565c0')
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: text, boxWidth: 12, padding: 14, font: { size: 12, weight: '600' } } },
        tooltip: {
          backgroundColor: isDark ? '#222' : '#fff',
          titleColor: text, bodyColor: text,
          borderColor: isDark ? '#555' : '#ccc', borderWidth: 1, padding: 10,
          callbacks: { label: ctx => ' '+ctx.dataset.label+': '+fmtM(ctx.parsed.y) }
        }
      },
      scales: {
        x: { ticks: { color: tick, maxRotation: 40, minRotation: 40, font: { size: 10 } }, grid: { color: grid, drawBorder: false } },
        y: {
          title: { display: true, text: 'Millones de $', color: tick, font: { size: 11 } },
          ticks: { color: tick, callback: v => v.toLocaleString('es-AR') },
          grid: { color: grid, drawBorder: false }, beginAtZero: false
        }
      }
    }
  });
}

function closeChartDlg(){
  const dlg = $('dlgChart');
  if(dlg && dlg.open) dlg.close();
  if(chartInst){ try{ chartInst.destroy(); }catch(e){} chartInst = null; }
}

function openChartDlg(){
  chartMode = mode;
  const dlg = $('dlgChart');
  if(!dlg) return;
  dlg.showModal();
  requestAnimationFrame(function(){
    renderChart();
    setTimeout(function(){ if(chartInst) chartInst.resize(); }, 60);
  });
}

$('btnGraf').onclick = openChartDlg;
$('chX').onclick = closeChartDlg;
$('chRec').onclick = function(){ chartMode = 'rec'; renderChart(); };
$('chPro').onclick = function(){ chartMode = 'pro'; renderChart(); };
$('dlgChart').addEventListener('cancel', function(){ if(chartInst){ try{ chartInst.destroy(); }catch(e){} chartInst = null; } });
$('dlgChart').addEventListener('click', function(e){ if(e.target === $('dlgChart')) closeChartDlg(); });

function cmPair(){const R=cmRows(),a=R[cmIdx];if(!a)return{a:null,b:null};return{a,b:R.find(x=>mk(x.m)===mk(a.m)-12)||null}}
function cmFill(name){const R=cmRows();let k=R.findIndex(r=>r.m===name);cmIdx=k>=0?k:Math.max(0,R.length-1);cmDraw()}
function pct(a,b){if(!b)return'<span>—</span>';const d=a/b-1,s=(Math.abs(d)*100).toFixed(1).replace('.',',')+'%';return d>=0?'<span class="up">▲ '+s+'</span>':'<span class="dn">▼ '+s+'</span>'}
function cmDraw(){const R=cmRows(),pair=cmPair(),a=pair.a,b=pair.b;$('cmRec').className=cmMode==='rec'?'on':'';$('cmPro').className=cmMode==='pro'?'on':'';
 if(!a){$('cmT').innerHTML='';$('cmHint').textContent='Sin datos';$('cmN').textContent='';return}
 $('cmHint').textContent=a.m+' · '+(b?b.m:'sin año anterior');
 let h='<div class="h">CASINO</div><div class="h">'+(b?b.m:'Año anterior')+'</div><div class="h">'+a.m+'</div><div class="h">Variación</div>';
 CAS.forEach((c,k)=>{const x=b?b.c[k]:0,y=a.c[k];h+='<div>'+c+'</div><div>'+(x?m$(x):'—')+'</div><div>'+(y?m$(y):'')+'</div><div>'+((x&&y)?pct(y,x):'—')+'</div>'});
 const x=b?cien(b,cmMode):0,y=cien(a,cmMode);h+='<div class="tt">100 PUNTOS I.O.MA.</div><div class="tt">'+(b?m$(x):'—')+'</div><div class="tt">'+m$(y)+'</div><div class="tt">'+(b?pct(y,x):'—')+'</div>';
 $('cmT').innerHTML=h;$('cmN').textContent='Comparación fija con el mismo mes del año anterior. ◀ ▶ cambian de mes'+(cmKeys?' · flechas del teclado activas':'')+'.'}
function armKeys(){cmKeys=true;$('cmPrev').classList.add('on');$('cmNext').classList.add('on');cmDraw()}
$('btnCmp').onclick=()=>{cmKeys=false;$('cmPrev').classList.remove('on');$('cmNext').classList.remove('on');cmMode=mode;cmFill($('sel').selectedOptions[0]?$('sel').selectedOptions[0].textContent:'');$('dlgCmp').showModal()};
$('cmX').onclick=()=>$('dlgCmp').close();$('cmRec').onclick=()=>{cmMode='rec';cmFill(cmRows()[cmIdx]?cmRows()[cmIdx].m:'')};$('cmPro').onclick=()=>{const name=cmRows()[cmIdx]?cmRows()[cmIdx].m:'';cmMode='pro';cmFill(name)};
function cmShift(d){const R=cmRows();let i=cmIdx+d;if(i<0||i>=R.length)return;cmIdx=i;cmDraw()}
$('cmPrev').onclick=()=>{armKeys();cmShift(-1)};
$('cmNext').onclick=()=>{armKeys();cmShift(1)};
$('dlgCmp').addEventListener('click',e=>{if(e.target===$('dlgCmp'))$('dlgCmp').close()});
$('dlgCmp').addEventListener('close',()=>{cmKeys=false;$('cmPrev').classList.remove('on');$('cmNext').classList.remove('on')});
$('dlgCmp').addEventListener('keydown',e=>{
  if(!cmKeys) return;
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight' && e.key!=='ArrowUp' && e.key!=='ArrowDown') return;
  e.preventDefault();
  cmShift((e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:1);
});

fill();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script></body></html>
